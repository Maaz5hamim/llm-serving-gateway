server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Proxy Prometheus so the dashboard avoids CORS and mixed-content issues
    location /prometheus/ {
        proxy_pass         http://prometheus:9090/;
        proxy_set_header   Host $host;
    }

    # Proxy gateway admin API so the admin key never leaves the local network
    location /gateway/ {
        proxy_pass         http://gateway:8080/;
        proxy_set_header   Host $host;
        proxy_read_timeout 60s;
    }
}
