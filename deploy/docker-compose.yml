services:
  gateway:
    build: ..
    ports: ["127.0.0.1:8080:8080"]
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY}
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway?sslmode=disable
      REDIS_URL: redis://redis:6379
      MODELS_CONFIG: /config/models.yaml
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
    volumes: ["../config:/config:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redis-data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 1s, retries: 30}
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: gateway, POSTGRES_PASSWORD: gateway, POSTGRES_DB: gateway}
    volumes: ["postgres-data:/var/lib/postgresql/data", "../db/migrations:/docker-entrypoint-initdb.d:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U gateway"], interval: 2s, timeout: 1s, retries: 30}
  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.cors.origin=.*"
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  dashboard:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8888:80"]
    volumes:
      - "./dashboard.html:/usr/share/nginx/html/index.html:ro"
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on: [gateway, prometheus]
volumes:
  redis-data:
  postgres-data:
